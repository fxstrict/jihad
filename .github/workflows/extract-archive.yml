name: Extract Project Archive

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    name: Extract S1 Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify archive exists
        run: |
          test -f "al-jihad-S1-updated-r2.zip"

      - name: Extract ZIP archive
        run: |
          mkdir -p /tmp/aljihad
          unzip -q al-jihad-S1-updated-r2.zip -d /tmp/aljihad

      - name: Verify project folder
        run: |
          test -d "/tmp/aljihad/al-jihad"

      - name: Copy project files safely
        run: |
          rsync -a --exclude='/.github/workflows/***' \
            /tmp/aljihad/al-jihad/ ./

      - name: Verify extracted files
        run: |
          test -f "package.json"
          test -f "package-lock.json"
          test -d "apps"
          test -d "packages"
          echo "Project extraction verified."

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract S1 project archive"
            git push
          fi
